<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />

  <title>My JS Game</title>
</head>

<body>
  <div style="margin-left: 160px; margin-top: 0px">
    <h1 style="font-size: 60px">
      Player 1 Deploy
      <a href="../index.html" style="text-decoration: none">
        <button id="back" style="font-size: 40px; width: 200px">Back</button>
      </a>

      <a href="./p2Deploy.html" style="text-decoration: none">
        <button id="saveAndContinue" style="font-size: 40px; width: 200px">Next</button>
      </a>
    </h1>

    <h1>
      Available Troops for
      <span>
        <select id="powers" style="font-size: 40px; border: 5px solid blue"></select>
      </span>
      <button id="clear" style="font-size: 40px; width: 200px">Clear</button>
    </h1>
    <h2>Money Left: <span style="margin-right: 100px;" id="moneyLeft"></span> Num Elites & Heroes Left: <span
        id="elitesHeroesLeft"></span></h2>

    <div style="height: 400px">
      <div style="display: none" id="allIconImages"></div>
      <div id="armImages"></div>

      <div style="margin-left: 160px">
        <canvas id="info" width="520" height="495" style="position: absolute; z-index: 100; background: black"></canvas>
      </div>
    </div>

    <div style="margin-top: -600px; margin-left: 900px; height: 860px">
      <div id="game" style="width: 650px; height: 850px; border: 5px blue dashed">
        <!-- map canvas, on which we draw the backgroud -->
        <canvas id="map" width="650" height="850"
          style="position: absolute; z-index: 100; background: url(../images/map/bg.png) repeat"></canvas>
        <!-- piece canvas, on which we draw all the arm pieces -->
        <canvas id="piece" width="650" height="850" style="position: absolute; z-index: 101"></canvas>
        <!-- select canvas, which accepts all mouse clicking events -->
        <canvas id="select" width="650" height="850" style="position: absolute; z-index: 103"></canvas>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
  <script type="module" src="./p1Deploy.js"></script>
</body>

</html>
