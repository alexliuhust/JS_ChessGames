<div style="margin-top: 10px;">
    <div class="d-flex justify-content-center">
        <div class="p-2" style="width: 300px;">
            <h1 id="title"></h1>
        </div>

        <div class="p-2">
            <select id="powers" style="font-size: 30px; width: 225px;"></select>
        </div>
        <div class="p-2" style="font-size: 20px; margin-top: -7px">
            <span id="moneyLeftLabel">Money Left:</span>
            <span id="moneyLeft" style="font-weight: 700;"></span>
            <span id="moneyUnit">G</span>
            <br />
            <span id="elitesHeroesLeftLabel">Elites & Heroes Left:</span>
            <span id="elitesHeroesLeft" style="font-weight: 700;"></span>
        </div>
        <div class="p-2" style="width: 180px;">
            <button id="clear" class="btn btn-outline-warning" style="font-size: 25px; width: 130px;">Clear</button>
        </div>

        <div class="p-2" style="width: 140px;">
            <a id="back" class="btn btn-outline-info top-button">Back</a>
        </div>
        <div class="p-2" style="width: 140px;">
            <a id="saveAndContinue" class="btn btn-outline-info top-button">Next</a>
        </div>
    </div>

    <div style="display: none" id="allIconImages"></div>

    <div class="d-flex justify-content-center">
        <div class="p-2">
            <div id="armImages" style="margin-bottom: 15px; "></div>
        </div>
    </div>

    <div class="d-flex justify-content-center">
        <div class="p-2">
            <div style="width: 530px; height: 698px;">
                <canvas id="info" width="530" height="698"
                    style="position: absolute; z-index: 100; background: black"></canvas>
            </div>
        </div>
        <div class="p-2">
            <div id="game" style="width: 455px; height: 595px;">
                <canvas id="map"
                    style="position: absolute; z-index: 100; background: url(../images/map/bg.png) repeat"></canvas>
                <canvas id="piece" style="position: absolute; z-index: 101"></canvas>
                <canvas id="select" style="position: absolute; z-index: 103"></canvas>
            </div>
        </div>
    </div>

</div>
