<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous" />

    <title>My JS Game</title>
  </head>
  <body>
    <div style="display: none" id="allArmImages"></div>
    <div style="display: none" id="allIconImages"></div>

    <!-------------------------------------------------------------------------------->
    <!--------------------------- Round Refreshing Buttons --------------------------->
    <!-------------------------------------------------------------------------------->
    <div style="margin-left: 1px">
      <input
        style="height: 70px; font-size: 20px; border-color: blue"
        id="endRoundForBlue"
        type="button"
        value="End Round For Blue" />
      <input
        style="height: 70px; font-size: 20px; margin-left: 950px; border-color: red; width: 198px"
        id="endRoundForRed"
        type="button"
        value="End Round For Red" />
      <a href="./p2Deploy.html">
        <input
          id="back"
          href="./p2Deploy.html"
          style="height: 70px; font-size: 20px; width: 530px"
          type="button"
          value="Back to Deployment" />
      </a>
    </div>

    <!-------------------------------------------------------------------------------->
    <!--------------------------------- Banner Canvas -------------------------------->
    <!-------------------------------------------------------------------------------->
    <div style="margin-top: -70px; margin-left: 200px; height: 70px">
      <canvas id="banner" width="950" height="70" style="position: absolute; z-index: 100; background: black"></canvas>
    </div>

    <!-------------------------------------------------------------------------------->
    <!------------------------------ Game Area Canvases ------------------------------>
    <!-------------------------------------------------------------------------------->
    <div style="margin-top: 1px; margin-left: 1px; height: 900px">
      <div id="game" style="width: 1350px; height: 850px">
        <!-- map canvas, on which we draw the backgroud -->
        <canvas
          id="map"
          width="1350"
          height="850"
          style="position: absolute; z-index: 100; background: url(../images/map/bg.png) repeat"></canvas>
        <!-- piece canvas, on which we draw all the arm pieces -->
        <canvas id="piece" width="1350" height="850" style="position: absolute; z-index: 101"></canvas>
        <!-- main canvas, on which we draw all the prompt effects -->
        <canvas id="main" width="1350" height="850" style="position: absolute; z-index: 102"></canvas>
        <!-- select canvas, which accepts all mouse clicking events -->
        <canvas id="select" width="1350" height="850" style="position: absolute; z-index: 103"></canvas>
      </div>
    </div>

    <!-------------------------------------------------------------------------------->
    <!------------------------------- Info Area Canvas ------------------------------->
    <!-------------------------------------------------------------------------------->
    <div style="margin-top: -900px; margin-left: 1355px; height: 850px">
      <canvas id="info" width="530" height="850" style="position: absolute; z-index: 100; background: black"></canvas>
    </div>

    <!-------------------------------------------------------------------------------->
    <!-------------------------------- Reckoning List -------------------------------->
    <!-------------------------------------------------------------------------------->
    <div style="margin-top: 5px; width: 650px; height: 200px; border: 5px solid blue"></div>
    <div style="margin-top: -208px; margin-left: 695px; width: 650px; height: 200px; border: 5px solid red"></div>

    <!-------------------------------------------------------------------------------->
    <!------------------------ The Main Entrance of the Game ------------------------->
    <!-------------------------------------------------------------------------------->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"></script>
    <script type="module" src="mainGame.js"></script>
  </body>
</html>
