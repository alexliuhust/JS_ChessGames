<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />

  <title>My JS Game</title>
</head>

<body>
  <div style="display: none" id="allArmImages"></div>
  <div style="display: none" id="allIconImages"></div>

  <div class="d-flex justify-content-center">
    <div class="p-2" style="height: 70px; width: 190px">
      <a class="btn btn-outline-info" id="endRoundForBlue"
        style="font-size: 20px; border: blue solid 3px; width: inherit; height: inherit">End Round For Blue
      </a>
    </div>

    <div class="p-2" style="margin-left: 10px;">
      <div style="height: 70px; width: 950px;">
        <canvas id="banner" width="950" height="70"
          style="position: absolute; z-index: 100; background: black"></canvas>
      </div>
    </div>

    <div class="p-2" style="height: 70px; width: 190px; margin-left: -5px;">
      <a class="btn btn-outline-info" id="endRoundForRed"
        style="font-size: 20px; border: red solid 3px; width: inherit; height: inherit">End Round For Red
      </a>
    </div>

    <div class="p-2" style="height: 70px; width: 530px; margin-left: 10px">
      <a class="btn btn-outline-info" id="back" href="./p2Deploy.html"
        style="font-size: 20px; border-color: black; width: inherit; height: inherit">Back to<br />Deployment
      </a>
    </div>
  </div>

  <div class="d-flex justify-content-center">
    <div class="p-2" style="margin-left: 15px;">
      <div id="game" style="width: 1350px; height: 850px; ">
        <canvas id="map" width="1350" height="850"
          style="position: absolute; z-index: 100; background: url(../images/map/bg.png) repeat"></canvas>
        <canvas id="piece" width="1350" height="850" style="position: absolute; z-index: 101"></canvas>
        <canvas id="main" width="1350" height="850" style="position: absolute; z-index: 102"></canvas>
        <canvas id="select" width="1350" height="850" style="position: absolute; z-index: 103"></canvas>
      </div>
    </div>

    <div class="p-2">
      <div style="width: 530px; height: 850px; margin-left: -5px;">
        <canvas id="info" width="530" height="850" style="z-index: 100; background: black"></canvas>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center">
    <div class="p-2" style="width: 670px; margin-right: 5px; margin-left: -542px;">
      <div id="reckoningDiv1" style="width: inherit; border: blue solid 3px"></div>
    </div>
    <div class="p-2" style="width: 670px; margin-left: 5px">
      <div id="reckoningDiv2" style="width: inherit; border: red solid 3px"></div>
    </div>
  </div>

  <!-------------------------------------------------------------------------------->
  <!------------------------ The Main Entrance of the Game ------------------------->
  <!-------------------------------------------------------------------------------->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
  <script type="module" src="mainGame.js"></script>
</body>

</html>
