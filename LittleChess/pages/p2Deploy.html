<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My JS Game</title>
    </head>
    <body>

        <div style="margin-left: 220px; margin-top: -40px;">
            <h1 style="font-size: 60px;">
                Player 2 Deploy
                <a href="./p1Deploy.html" style="text-decoration: none;">
                    <button style="font-size: 40px;">
                        Back to Player 1's Deployment
                    </button>
                </a>
    
                <a href="./mainGame.html" style="text-decoration: none;">
                    <button style="font-size: 40px;">
                        Start Game!
                    </button>
                </a>
            </h1>

            <h1>Available Troops for <span id="power"></span></h1>
            <h2>Money Left: <span id="moneyLeft"></span></h2>

            <div style="height: 400px;">
                <div style="float: left;" id="0"></div>
                <div style="float: left;" id="1"></div>
                <div style="float: left;" id="2"></div>
                <div style="float: left;" id="3"></div>
                <div style="float: left;" id="4"></div>
                <div style="float: left;" id="5"></div>
                <div style="float: left;" id="6"></div>
                <div style="float: left;" id="7"></div>
                <div style="float: left;" id="8"></div><br /><br /><br /><br />
    
                <br />
                <b><span style="font-size: 26px;" id="simpleInfo1">No Troop Info</span></b><br />
                <span style="font-size: 26px;" id="simpleInfo2">No Troop Info</span>
            </div>

            <div style="margin-top: -400px; margin-left: 650px; height: 650px">
                <div style="width:850px; height: 50px; text-align: center;">
                    <span style="font-size: 48px; color: blue"><b>Enemy Side</b></span>
                </div>
                <div id="game" style="width:850px; height:600px; border: 5px red dashed">
                    <!-- map canvas, on which we draw the backgroud -->
                    <canvas id="map" width="850" height="600" 
                      style="position:absolute; z-index: 100; background:url(../images/map/bg.png) repeat;"></canvas>
                    <!-- piece canvas, on which we draw all the arm pieces -->
                    <canvas id="piece" width="850" height="600" 
                      style="position:absolute; z-index: 101;"></canvas>
                    <!-- select canvas, which accepts all mouse clicking events -->
                    <canvas id="select" width="850" height="600" 
                      style="position:absolute; z-index: 103;"></canvas>
                </div>
            </div>
            
        </div>
        <script type="module" src="./p2Deploy.js"></script>
    </body>
</html>
