<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My JS Game</title>
  </head>
  <body>
    <div style="margin-left: 160px; margin-top: 0px">
      <h1 style="font-size: 60px">
        Player 2 Deploy
        <a href="./p1Deploy.html" style="text-decoration: none">
          <button id="back" style="font-size: 40px; width: 200px">Back</button>
        </a>

        <a href="./mainGame.html" style="text-decoration: none">
          <button id="saveAndContinue" style="font-size: 40px; width: 200px">Start</button>
        </a>
      </h1>

      <h1>
        Available Troops for
        <span>
          <select id="powers" style="font-size: 40px; border: 5px solid red"></select>
        </span>
        <button id="clear" style="font-size: 40px; width: 200px">Clear</button>
      </h1>
      <h2>Money Left: <span style="margin-right: 100px;" id="moneyLeft"></span> Num Elites & Heroes Left: <span id="elitesHeroesLeft"></span></h2>

      <div style="height: 400px">
        <div style="display: none" id="allIconImages"></div>
        <div id="armImages"></div>

        <div style="margin-left: 160px">
          <canvas
            id="info"
            width="520"
            height="495"
            style="position: absolute; z-index: 100; background: black"></canvas>
        </div>
      </div>

      <div style="margin-top: -600px; margin-left: 900px; height: 860px">
        <div id="game" style="width: 650px; height: 850px; border: 5px red dashed">
          <!-- map canvas, on which we draw the backgroud -->
          <canvas
            id="map"
            width="650"
            height="850"
            style="position: absolute; z-index: 100; background: url(../images/map/bg.png) repeat"></canvas>
          <!-- piece canvas, on which we draw all the arm pieces -->
          <canvas id="piece" width="650" height="850" style="position: absolute; z-index: 101"></canvas>
          <!-- select canvas, which accepts all mouse clicking events -->
          <canvas id="select" width="650" height="850" style="position: absolute; z-index: 103"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="./p2Deploy.js"></script>
  </body>
</html>
