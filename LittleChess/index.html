<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My JS Game</title>
    </head>
    <body>

        <div style="margin-left: 0px; margin-top: 100px; text-align: center;">
            <h1 style="font-size: 70px;">Little Chess</h1><br /><br />


            <div style="font-size: 50px;"><b>Choose Powers And Max Cost</b></div><br /><br /><br />
            <div style="font-size: 40px;">
                <label for="powersForPlayer1">Player 1 Choose a Power:</label>
                <select name="powersForPlayer1" id="powersForPlayer1" style="font-size: 40px">
                    <option value="nordfort">Nord Fort 诺德堡</option>
                    <option value="dimwoods">Dim Woods 幽暗森林</option>
                    <option value="stormreef">Storm Reef 风暴礁</option>
                    <option value="empire">Terran Empire 泰伦帝国</option>
                    <option value="snowhaupt">Snowhaupt 雪顶要塞</option>
                    <option value="polluteland">Polluteland 污染之地</option>
                    <option value="burningterra">Burning Terra 燃烧领</option>
                    <option value="oldcemetery">Old Cemetery 老墓园</option>
                </select>
            </div>

            <br /><br /><br />

            <div style="font-size: 40px;">
                <label for="powersForPlayer2">Player 2 Choose a Power:</label>
                <select name="powersForPlayer2" id="powersForPlayer2" style="font-size: 40px">
                    <option value="nordfort">Nord Fort 诺德堡</option>
                    <option value="dimwoods">Dim Woods 幽暗森林</option>
                    <option value="stormreef">Storm Reef 风暴礁</option>
                    <option value="empire">Terran Empire 泰伦帝国</option>
                    <option value="snowhaupt">Snowhaupt 雪顶要塞</option>
                    <option value="polluteland">Polluteland 污染之地</option>
                    <option value="burningterra">Burning Terra 燃烧领</option>
                    <option value="oldcemetery">Old Cemetery 老墓园</option>
                </select>
            </div>

            <br /><br /><br />

            <div style="font-size: 40px;">
                <label for="maxCost">Choose Max Cost:</label>
                <select name="maxCost" id="maxCost" style="font-size: 40px">
                    <option value="1000">1000 G</option>
                    <option value="1500">1500 G</option>
                    <option value="2000">2000 G</option>
                    <option value="2500">2500 G</option>
                    <option value="3000">3000 G</option>
                </select>
            </div>

            <br /><br /><br />

            <div style="font-size: 40px;">
                <label for="useMandarin">Choose Language:</label>
                <select name="useMandarin" id="useMandarin" style="font-size: 40px">
                    <option value="false">English</option>
                    <option value="true">中文</option>
                </select>
            </div>

            <br /><br /><br />

            <a href="./pages/p1Deploy.html">
                <button style="font-size: 40px;">
                    Go to Deployment
                </button>
            </a>
        </div>
        
        <script type="module" src="index.js"></script>
    </body>
</html>
