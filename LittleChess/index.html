<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JS Game</title>
</head>
<body>
    <img src="images/empire/SwordInfantry.png" id="SwordInfantry_img" style="display:none;" />
    <img src="images/empire/PalaceGuard.png" id="PalaceGuard_img" style="display:none;" />
    <img src="images/empire/Musketeer.png" id="Musketeer_img" style="display:none;" />
    <img src="images/empire/MusketRider.png" id="MusketRider_img" style="display:none;" />
    <img src="images/empire/Vanguard.png" id="Vanguard_img" style="display:none;" />
    <img src="images/empire/PalaceKnight.png" id="PalaceKnight_img" style="display:none;" />
    <img src="images/empire/CannonGroup.png" id="CannonGroup_img" style="display:none;" />
    <img src="images/empire/EmpireMortar.png" id="EmpireMortar_img" style="display:none;" />
    <img src="images/empire/SteamTank.png" id="SteamTank_img" style="display:none;" />

    <div id="game" style="position:relative;float:left;width:1200px;height:500px;">
        <canvas id="map" width="1200" height="500" style="background:url(images/map/bg.png) repeat;position:absolute;left:0;top:0;z-index:99;"></canvas>
        <canvas id="piece" width="1200" height="500" style="position:absolute;left:0;top:0;z-index:100;"></canvas>
        <canvas id="main" width="1200" height="500" style="position:absolute;left:0;top:0;z-index:101;"></canvas>
        <canvas id="select" width="1200" height="500" style="position:absolute;left:0;top:0;z-index:102;"></canvas>
    </div>

    <div style="float:left;width:500px;margin-left:1200px;">
        <input id="refreshRound" type="button" value="Refresh Round" />
    </div>



    <script type="module" src="index.js"></script>
</body>
</html>
