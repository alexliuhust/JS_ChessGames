<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JS Game</title>
</head>
<body>
    <img src="images/empire/SwordInfantry.png" id="SwordInfantry_img" style="display:none;" />
    <img src="images/empire/PalaceGuard.png" id="PalaceGuard_img" style="display:none;" />
    <img src="images/empire/Musketeer.png" id="Musketeer_img" style="display:none;" />
    <img src="images/empire/MusketRider.png" id="MusketRider_img" style="display:none;" />
    <img src="images/empire/Vanguard.png" id="Vanguard_img" style="display:none;" />
    <img src="images/empire/PalaceKnight.png" id="PalaceKnight_img" style="display:none;" />
    <img src="images/empire/CannonGroup.png" id="CannonGroup_img" style="display:none;" />
    <img src="images/empire/EmpireMortar.png" id="EmpireMortar_img" style="display:none;" />
    <img src="images/empire/SteamTank.png" id="SteamTank_img" style="display:none;" />


    <div style="margin-left:10px;">
        <input id="refreshRound" type="button" value="Refresh Round" />
    </div>

    <div style="margin-top: 10px; margin-left: 10px; height: 800px">

        <div id="game" style="width:1200px;height:750px;">
            <canvas id="map" width="1200" height="750" 
              style="position:absolute; z-index: 100; background:url(images/map/bg.png) repeat;"></canvas>
            <canvas id="piece" width="1200" height="750" 
              style="position:absolute; z-index: 101;"></canvas>
            <canvas id="main" width="1200" height="750" 
              style="position:absolute; z-index: 102;"></canvas>
            <canvas id="select" width="1200" height="750" 
              style="position:absolute; z-index: 103;"></canvas>
        </div>

    </div>

    <div style="margin-top: -800px; margin-left: 1215px; height: 750px">
        <canvas id="info" width="460" height="750" 
           style="position:absolute; z-index: 100; background: black;"></canvas>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
